spring.application.name=springboot-rest-api
# Local teaching application: it stays on the Spring Boot default port and is
# only meant to be exercised by hand from Postman or Bruno.
server.port=8080

# Value every request to /products must send in the "API-Key" header.
# The lab fixes it to 123456; it lives here rather than in the controller so it
# can be changed without touching code.
products.api-key=123456
